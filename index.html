<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LIOOOOKANGEEEEN</title>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Inter:wght@300;400;600&family=Pacifico&display=swap" rel="stylesheet">
  <style>
    :root{
      --paper-width: min(920px, 94%);
      --paper-height: min(720px, 82vh);
      --accent:#6b3f1a;
      --text:#2b2b2b;
      --shadow: rgba(0,0,0,0.18);
    }
    html,body{
      height:100%;
      margin:0;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: radial-gradient(circle at 10% 10%, #f6efe6 0%, #efe7dd 30%, #f7f3ee 100%);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    .polaroid {
      width: 180px;
      height: 200px;
      position: absolute;
      left: 28px;
      bottom: 110px;
      transform: rotate(-6deg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 6px;
      box-sizing: border-box;
      background: linear-gradient(180deg,#fff,#f6f6f6);
      border: 8px solid #fff;
      box-shadow: 0 10px 22px rgba(0,0,0,0.18);
      z-index: 5;
      pointer-events: none;
    }

    .polaroid img {
      width: 100%;
      height: auto;
      max-height: 140px;
      object-fit: cover;
      border-radius: 2px;
    }

    .polaroid .caption {
      margin-top: 6px;
      font-size: 12px;
      color: #b3a08a;
      text-align: center;
    }

    .stage{
      width:var(--paper-width);
      max-width:100%;
      display:flex;
      gap:18px;
      align-items:flex-start;
      justify-content:center;
      flex-direction:column;
    }

    .paper{
      width:100%;
      height:var(--paper-height);
      margin:0 auto;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.02)),
        radial-gradient(120px 80px at 12% 18%, rgba(120,70,30,0.12), rgba(120,70,30,0.02) 40%),
        radial-gradient(90px 60px at 78% 72%, rgba(120,70,30,0.10), rgba(120,70,30,0.01) 40%),
        radial-gradient(60px 40px at 55% 22%, rgba(120,70,30,0.06), rgba(120,70,30,0.00) 40%),
        linear-gradient(180deg,#f7efe2,#f3eadf);
      border-radius:8px;
      box-shadow: 0 20px 48px var(--shadow), inset 0 2px 0 rgba(255,255,255,0.6);
      padding:48px 64px;
      position:relative;
      overflow:hidden;
      border:1px solid rgba(0,0,0,0.06);
      transform-origin:center;
      transition:transform .35s ease;
      font-family: "Libre Baskerville", serif;
      color:var(--text);
      display:flex;
      flex-direction:column;
      justify-content:flex-start;
    }

    .content{
      width:100%;
      height:100%;
      overflow:auto;
      padding-right:8px;
      line-height:1.7;
      font-size:18px;
      -webkit-overflow-scrolling:touch;
    }

    h1{
      margin:0 0 8px 0;
      font-size:30px;
      color:var(--accent);
      letter-spacing:0.6px;
    }
    .meta{
      font-size:14px;
      color:#6b6b6b;
      margin-bottom:18px;
    }
    p{
      margin:0 0 16px 0;
      white-space:pre-wrap;
    }

    .controls{
      display:flex;
      gap:12px;
      align-items:center;
      justify-content:center;
      margin-top:12px;
    }
    .btn{
      background:#fff;
      border:1px solid rgba(0,0,0,0.08);
      padding:10px 16px;
      border-radius:8px;
      cursor:pointer;
      box-shadow: 0 6px 14px rgba(0,0,0,0.06);
      transition:transform .18s ease, box-shadow .18s ease;
      font-weight:600;
    }
    .btn:active{ transform:translateY(1px) }
    .btn:disabled{
      opacity:0.45;
      cursor:default;
      transform:none;
      box-shadow:none;
    }

    .pager{
      font-size:13px;
      color:#5a5a5a;
      min-width:120px;
      text-align:center;
    }

    .signature{
      font-family: "Pacifico", "Libre Baskerville", cursive;
      font-size:20px;
      color: #5a2f12;
      display:inline-block;
      transform-origin:left center;
      opacity:0;
      transition:opacity .6s ease, transform .6s cubic-bezier(.2,.9,.3,1);
      margin-top:18px;
    }

    .signature.show{ opacity:1; transform:translateY(0) scale(1); }

    @media (max-width:640px){
      .paper{ padding:28px 20px; height:72vh; font-size:16px; }
      h1{ font-size:22px; }
      .polaroid{
        left: 14px;
        bottom: 90px;
        width: 120px;
        height: 160px;
        transform: rotate(-4deg);
      }
      .polaroid img { max-height: 100px; }
      .polaroid .caption { font-size: 10px; }
      .signature{ font-size:18px; }
    }
  </style>
</head>
<body>
  <div class="stage" role="main" aria-label="Surat untuk Eliora">
    <div class="paper" id="paper" aria-live="polite">
      <div class="content" id="content"></div>
    </div>

    <div class="controls" aria-hidden="false">
      <button class="btn" id="prevBtn" aria-label="Sebelumnya">Prev</button>
      <div class="pager" id="pager" aria-live="polite">Halaman 1 / 1</div>
      <button class="btn" id="nextBtn" aria-label="Berikutnya">Next</button>
    </div>

    <div style="display:flex; align-items:center; justify-content:center; gap:12px; margin-top:6px;">
      <div class="dots" id="dots" aria-hidden="true"></div>
    </div>
  </div>

  <script>
    const pages = [
`Bandung, 14-3-1945

Eliora,


kadang kalau aku lagi ngelamun mikirin hal lain, suka aja tiba-tiba keinget kamu. kayak aku suka tiap dengerin kamu cerita random, kamu teriak-teriak, kamu marahin aku. terus ini juga nempel di kepala, kebiasaan ini tiap kamu mau main sama aku waktu itu suka nempelin land mine di bawah banyak-banyak. tiap aku keinget itu, suka senyum-senyum sendiri aja, kayak seneng banget gitu.

`,

`Eliora,


aku juga suka keingat tiap kamu datang main, nanyain aku di mana, cariin aku di mana, kalau ketemu ketawa terus diam di sebelah liatin timer. terus ini baru-baru ini nggak tahu kenapa tapi lucu banget tiap main game burik, terus ada musuh, kamu maju polos banget terus mati gatau itu lucu. terus setiap main panik di depan pintu dorong-dorong kamu emot transisi. terus ada waktu kita nonton me before you,waktu kamu cerita film me before you juga.
`,

`maaf sayang


aku sadar hari ini mungkin nggak sesuai sama yang kamu pengen atau bayangin kamu, aku minta maaf. aku nggak pengen nyepelein kamu, tapi jujur aku masih bingung harus bikin apa biar sesuai sama bayangan kamu. aku pengen usaha sebisa aku, aku pengen kamu ngerasa spesial.
`,

`Penutup

Dengan segala kerendahan hati dan harapan,
Aku.

jadi ya gitu… gimana, kalau mau emang kita mulai lagi? aku bakal terus belajar, usaha, dan aku bener-bener serius mau berubah. aku pengen kita bisa lebih baik, lebih nyambung, dan aku pengen bikin kamu ngerasa nyaman sama aku lagi..`
    ];

    const contentEl = document.getElementById('content');
    const pagerEl = document.getElementById('pager');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const dotsEl = document.getElementById('dots');
    const paper = document.getElementById('paper');

    let idx = 0;

    function escapeHtml(s){
      return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('\\n','<br>');
    }

    function render(){
      const raw = pages[idx];
      const lines = raw.split('\\n\\n');
      let html = '';
      if(lines[0] && lines[0].length < 40){
        html += `<h1>${escapeHtml(lines[0])}</h1>`;
        lines.shift();
      }
      html += `<div class="meta">Untuk: <strong>Eliora</strong></div>`;
      lines.forEach(par => { html += `<p>${escapeHtml(par)}</p>`; });

      html += `<div id="sigWrap"><div class="signature" id="signature">— A</div></div>`;
      contentEl.innerHTML = html;
      pagerEl.textContent = 'Halaman ' + (idx+1) + ' / ' + pages.length;
      prevBtn.disabled = idx === 0;
      nextBtn.disabled = idx === pages.length - 1;
      updateDots();

      paper.style.transform = 'rotate(-0.6deg) scale(1.002)';
      setTimeout(()=> paper.style.transform = 'rotate(0deg) scale(1)', 260);

      const paras = contentEl.querySelectorAll('p');
      paras.forEach(p => p.classList.remove('typewriter'));
      if(paras.length) paras[0].classList.add('typewriter');

      const signatureEl = document.getElementById('signature');
      signatureEl.classList.remove('show');
      setTimeout(()=> signatureEl.classList.add('show'), 900);

      if (idx === pages.length - 1) {
        if (!document.getElementById('polaroid')) {
          const polHtml = `
            <div class="polaroid" id="polaroid">
              <img id="polaroidImg" src="./images/Eliora.jpg" alt="Kenangan kita" />
              <div class="caption">Kenangan kita</div>
            </div>`;
          paper.insertAdjacentHTML('beforeend', polHtml);
        }
      } else {
        const existing = document.getElementById('polaroid');
        if (existing) existing.remove();
      }
    }

    prevBtn.addEventListener('click', ()=> { if(idx>0){ idx--; render(); } });
    nextBtn.addEventListener('click', ()=> { if(idx<pages.length-1){ idx++; render(); } });

    window.addEventListener('keydown', (e)=>{
      if(e.key==='ArrowRight') nextBtn.click();
      if(e.key==='ArrowLeft') prevBtn.click();
    });

    function updateDots(){
      dotsEl.innerHTML='';
      for(let i=0;i<pages.length;i++){
        const d=document.createElement('div');
        d.className='dot'+(i===idx?' active':'');
        d.title='Halaman '+(i+1);
        d.style.cursor='pointer';
        d.addEventListener('click', ()=>{ idx=i; render(); });
        dotsEl.appendChild(d);
      }
    }

    render();
  </script>
</body>
</html>
