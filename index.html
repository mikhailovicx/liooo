<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>lioooooo</title>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Inter:wght@300;400;600&family=Pacifico&display=swap" rel="stylesheet">
  <style>
    :root{
      --paper-width: min(920px, 94%);
      --paper-height: min(720px, 82vh);
      --accent:#6b3f1a;
      --text:#2b2b2b;
      --shadow: rgba(0,0,0,0.18);
    }
    html,body{height:100%;margin:0;font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial;background:radial-gradient(circle at 10% 10%, #f6efe6 0%, #efe7dd 30%, #f7f3ee 100%);display:flex;align-items:center;justify-content:center;padding:28px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
    .stage{width:var(--paper-width);max-width:100%;display:flex;gap:18px;align-items:flex-start;justify-content:center;flex-direction:column;}
    .paper{width:100%;height:var(--paper-height);margin:0 auto;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.02)),radial-gradient(120px 80px at 12% 18%, rgba(120,70,30,0.12), rgba(120,70,30,0.02) 40%),radial-gradient(90px 60px at 78% 72%, rgba(120,70,30,0.10), rgba(120,70,30,0.01) 40%),radial-gradient(60px 40px at 55% 22%, rgba(120,70,30,0.06), rgba(120,70,30,0.00) 40%),linear-gradient(180deg,#f7efe2,#f3eadf);border-radius:8px;box-shadow:0 20px 48px var(--shadow), inset 0 2px 0 rgba(255,255,255,0.6);padding:48px 64px;position:relative;overflow:hidden;border:1px solid rgba(0,0,0,0.06);transform-origin:center;transition:transform .35s ease;font-family:"Libre Baskerville",serif;color:var(--text);display:flex;flex-direction:column;justify-content:flex-start;}
    .paper::before,.paper::after{content:"";position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none;background-image:linear-gradient(90deg, rgba(0,0,0,0.02), rgba(255,255,255,0.02) 50%, rgba(0,0,0,0.02));mix-blend-mode:multiply;opacity:0.6;transform:rotate(-1deg) scale(1.02);}
    .paper::after{transform:rotate(1deg) scale(1.01);opacity:0.35;filter:blur(1px);}
    .content{width:100%;height:100%;overflow:auto;padding-right:8px;line-height:1.7;font-size:18px;-webkit-overflow-scrolling:touch;position:relative;z-index:5;}
    h1{margin:0 0 8px 0;font-size:30px;color:var(--accent);letter-spacing:0.6px;}
    .meta{font-size:14px;color:#6b6b6b;margin-bottom:18px;}
    p{margin:0 0 16px 0;white-space:pre-wrap;}
    .controls{display:flex;gap:12px;align-items:center;justify-content:center;margin-top:12px;}
    .btn{background:#fff;border:1px solid rgba(0,0,0,0.08);padding:10px 16px;border-radius:8px;cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,0.06);transition:transform .18s ease,box-shadow .18s ease;font-weight:600;}
    .btn:active{transform:translateY(1px)}
    .btn:disabled{opacity:0.45;cursor:default;transform:none;box-shadow:none;}
    .pager{font-size:13px;color:#5a5a5a;min-width:120px;text-align:center;}
    .dog{position:absolute;font-size:28px;will-change:transform;animation:float 6s ease-in-out infinite;opacity:0.95;filter:drop-shadow(0 6px 8px rgba(0,0,0,0.12));pointer-events:none;}
    .dog.small{font-size:22px;animation-duration:5.5s;}
    .dog.large{font-size:34px;animation-duration:7s;}
    @keyframes float{0%{transform:translateY(0) translateX(0) rotate(-2deg);}50%{transform:translateY(-10px) translateX(6px) rotate(2deg);}100%{transform:translateY(0) translateX(0) rotate(-2deg);}}
    .dots{display:flex;gap:6px;align-items:center;}
    .dot{width:8px;height:8px;border-radius:50%;background:rgba(0,0,0,0.12);}
    .dot.active{background:var(--accent);box-shadow:0 2px 6px rgba(107,63,26,0.18);}

    /* polaroid dan gambar yang pas */
    .polaroid{
      width:180px;
      height:170px;
      background:#fff;
      border:10px solid #fff;
      box-shadow:0 12px 26px rgba(0,0,0,0.18);
      position:absolute;
      left:28px;
      bottom:110px;
      transform:rotate(-6deg);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      z-index:6;
      pointer-events:auto;
      background-repeat:no-repeat;
      background-position:center center;
      background-size:cover;
      flex-direction:column;
    }
    .polaroid img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    /* caption "<3" di bawah foto */
    .polaroid-caption{
      width:100%;
      text-align:center;
      font-size:18px;
      color:#b85a6b;
      margin-top:6px;
      font-weight:700;
      letter-spacing:1px;
      text-shadow: 0 1px 0 rgba(255,255,255,0.6);
      opacity:0;
      transform:translateY(6px);
      transition:opacity .45s ease, transform .45s cubic-bezier(.2,.9,.3,1);
      pointer-events:none;
      user-select:none;
    }
    .polaroid-caption.show{ opacity:1; transform:translateY(0); }

    /* emoji cloud (tidak menghalangi teks) */
    .emoji-cloud{
      position:absolute;
      inset:0;
      pointer-events:none;
      z-index:4; /* di bawah konten (z-index konten = 5) */
      overflow:visible;
    }
    .emoji-cloud .e{
      position:absolute;
      font-size:20px;
      opacity:0.72;
      transform-origin:center;
      will-change:transform,opacity;
      filter:drop-shadow(0 6px 8px rgba(0,0,0,0.06));
      transition:transform .6s ease, opacity .6s ease;
      pointer-events:none;
      user-select:none;
    }
    .emoji-cloud .e.small{ font-size:16px; opacity:0.55; animation:floatSmall 6s ease-in-out infinite; }
    .emoji-cloud .e.mid{ font-size:22px; opacity:0.68; animation:floatMid 7s ease-in-out infinite; }
    .emoji-cloud .e.large{ font-size:28px; opacity:0.82; animation:floatLarge 8s ease-in-out infinite; }
    @keyframes floatSmall{0%{transform:translateY(0) rotate(-6deg);}50%{transform:translateY(-8px) rotate(4deg);}100%{transform:translateY(0) rotate(-6deg);}}
    @keyframes floatMid{0%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-10px) rotate(3deg);}100%{transform:translateY(0) rotate(-3deg);}}
    @keyframes floatLarge{0%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-12px) rotate(2deg);}100%{transform:translateY(0) rotate(-2deg);}}

    /* signature, seal, paw */
    .signature{font-family:"Pacifico","Libre Baskerville",cursive;font-size:20px;color:#5a2f12;display:inline-block;transform-origin:left center;opacity:0;transition:opacity .6s ease, transform .6s cubic-bezier(.2,.9,.3,1);margin-top:18px;z-index:5;}
    .wax-seal{position:absolute;right:28px;bottom:28px;width:72px;height:72px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #ff6b3a 0%, #b33b1a 45%, #7a2a12 100%);box-shadow:0 8px 18px rgba(0,0,0,0.28), inset 0 -6px 12px rgba(0,0,0,0.12);display:flex;align-items:center;justify-content:center;color:rgba(255,240,230,0.9);font-weight:700;font-size:18px;transform:rotate(-6deg);border:2px solid rgba(0,0,0,0.06);z-index:7;pointer-events:none;}
    .wax-seal::after{content:"✶";transform:translateY(-2px);filter:drop-shadow(0 1px 0 rgba(255,255,255,0.06));}
    .paw{position:absolute;left:12px;top:28%;font-size:18px;color:rgba(90,50,20,0.18);transform:rotate(-12deg);opacity:0.9;pointer-events:none;}
    .paw.p2{top:36%;left:6%;transform:rotate(-6deg);font-size:16px;opacity:0.7;}
    .paw.p3{top:46%;left:10%;transform:rotate(-18deg);font-size:14px;opacity:0.55;}
    .paper.torn{box-shadow:0 26px 58px rgba(0,0,0,0.26), inset 0 2px 0 rgba(255,255,255,0.6);border-radius:6px;background-clip:padding-box;}
    .typewriter p{display:block;overflow:hidden;white-space:pre-wrap;border-right:.12em solid rgba(0,0,0,0.12);animation:typing 1.6s steps(40,end), blink .9s step-end infinite;}
    @keyframes typing{from{width:0;}to{width:100%;}}@keyframes blink{50%{border-color:transparent;}}
    .signature.show{opacity:1;transform:translateY(0) scale(1);}

    @media (max-width:640px){
      .paper{padding:28px 20px;height:72vh;font-size:16px;}
      .dog{font-size:20px;}
      h1{font-size:22px;}
      .wax-seal{width:56px;height:56px;font-size:16px;right:18px;bottom:18px;}
      .signature{font-size:18px;}
      .polaroid{width:140px;height:120px;left:14px;bottom:90px;transform:rotate(-4deg);}
      .polaroid-caption{font-size:16px;margin-top:4px;}
      .emoji-cloud .e{ font-size:16px; opacity:0.6; }
      .emoji-cloud .e.large{ font-size:22px; }
    }
  </style>
</head>
<body>
  <div class="stage" role="main" aria-label="lioooooo">
    <div class="paper" id="paper" aria-live="polite">
      <div class="content" id="content"></div>

      <!-- emoji cloud (added) -->
      <div class="emoji-cloud" id="emojiCloud" aria-hidden="true"></div>

      <div class="dog" style="left:8%; top:18%;">🐶</div>
      <div class="dog small" style="left:78%; top:62%;">🐶</div>
      <div class="dog large" style="left:50%; top:8%;">🐶</div>
    </div>

    <div class="controls" aria-hidden="false">
      <button class="btn" id="prevBtn" aria-label="Sebelumnya">Prev</button>
      <div class="pager" id="pager" aria-live="polite">Halaman 1 / 1</div>
      <button class="btn" id="nextBtn" aria-label="Berikutnya">Next</button>
    </div>

    <div style="display:flex; align-items:center; justify-content:center; gap:12px; margin-top:6px;">
      <div class="dots" id="dots" aria-hidden="true"></div>
    </div>
  </div>

  <script>
    // Ganti PHOTO_URL di sini dengan link gambar kamu (Drive direct link, raw GitHub, atau URL langsung)
    const PHOTO_URL = "https://drive.google.com/uc?export=view&id=1BOMo5GSc-lm1shg0Ze5TLSWAIKm0YmGl";

    const pages = [`Bandung, 14-3-1945

Eliora,


kadang kalau aku lagi ngelamun mikirin hal lain, suka aja tiba-tiba keinget kamu. kayak aku suka tiap dengerin kamu cerita random, kamu teriak-teriak, kamu marahin aku. terus ini juga nempel di kepala, kebiasaan ini tiap kamu mau main sama aku waktu itu suka nempelin land mine di bawah banyak-banyak. tiap aku keinget itu, suka senyum-senyum sendiri aja, kayak seneng banget gitu.

`,

`Eliora,


aku juga suka keingat tiap kamu datang main, nanyain aku di mana, cariin aku di mana, kalau ketemu ketawa terus diam di sebelah liatin timer. terus ini baru-baru ini nggak tahu kenapa tapi lucu banget tiap main game burik, terus ada musuh, kamu maju polos banget terus mati gatau itu lucu. terus setiap main panik di depan pintu dorong-dorong kamu emot transisi. terus ada waktu kita nonton me before you,waktu kamu cerita film me before you juga.
`,

`maaf sayang


aku sadar hari ini mungkin nggak sesuai sama yang kamu pengen atau bayangin kamu, aku minta maaf. aku nggak pengen nyepelein kamu, tapi jujur aku masih bingung harus bikin apa biar sesuai sama bayangan kamu. aku pengen usaha sebisa aku, aku pengen kamu ngerasa spesial.
`,

`Penutup

Dia perempuan terbaik. Tercantik. Sehat selalu istriku. Kamu penting di hidupku.

jadi ya gitu… gimana, kalau mau emang kita mulai lagi? aku bakal terus belajar, usaha, dan aku bener-bener serius mau berubah. aku pengen kita bisa lebih baik, lebih nyambung, dan aku pengen bikin kamu ngerasa nyaman sama aku lagi..`
    ];


    const contentEl = document.getElementById('content');
    const pagerEl = document.getElementById('pager');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const dotsEl = document.getElementById('dots');
    const paper = document.getElementById('paper');

    let idx = 0;

    function escapeHtml(s){ return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('\\n','<br>'); }

    function render(){
      const raw = pages[idx];
      const lines = raw.split('\\n\\n');
      let html = '';
      if(lines[0] && lines[0].length < 40){ html += `<h1>${escapeHtml(lines[0])}</h1>`; lines.shift(); }
      html += `<div class="meta">Untuk: <strong>Eliora</strong></div>`;
      lines.forEach(par => { html += `<p>${escapeHtml(par)}</p>`; });
      html += `<div id="sigWrap"><div class="signature" id="signature">— A</div></div>`;
      contentEl.innerHTML = html;
      pagerEl.textContent = 'Halaman ' + (idx+1) + ' / ' + pages.length;
      prevBtn.disabled = idx === 0;
      nextBtn.disabled = idx === pages.length - 1;
      updateDots();
      paper.style.transform = 'rotate(-0.6deg) scale(1.002)';
      setTimeout(()=> paper.style.transform = 'rotate(0deg) scale(1)', 260);

      const paras = contentEl.querySelectorAll('p');
      paras.forEach(p => p.classList.remove('typewriter'));
      if(paras.length) paras[0].classList.add('typewriter');

      const signatureEl = document.getElementById('signature');
      signatureEl.classList.remove('show');
      setTimeout(()=> signatureEl.classList.add('show'), 900);

      // polaroid handling: tampilkan hanya di halaman terakhir
      const existing = document.getElementById('polaroid');
      if(idx === pages.length - 1){
        if(!existing){
          const polHtml = `<div class="polaroid" id="polaroid"><img id="polaroidImg" src="https://drive.google.com/thumbnail?id=1BOMo5GSc-lm1shg0Ze5TLSWAIKm0YmGl&sz=w1000" alt="liooooo" /><div class="polaroid-caption">&lt;3</div></div>`;
          paper.insertAdjacentHTML('beforeend', polHtml);
          const imgEl = document.getElementById('polaroidImg');

          // jika gambar gagal load atau ukurannya kecil, fallback ke background cover
          imgEl.addEventListener('error', ()=> {
            const pol = document.getElementById('polaroid');
            if(pol) {
              pol.style.backgroundImage = `url('${PHOTO_URL}')`;
              imgEl.remove();
              const cap = pol.querySelector('.polaroid-caption');
              if(cap) cap.classList.add('show');
            }
          });
          imgEl.addEventListener('load', ()=> {
            // jika resolusi asli terlalu kecil, gunakan background cover agar tidak blur
            if(imgEl.naturalWidth < 300 || imgEl.naturalHeight < 200){
              const pol = document.getElementById('polaroid');
              if(pol){
                pol.style.backgroundImage = `url('${PHOTO_URL}')`;
                imgEl.style.display = 'none';
              }
            }
            // tampilkan caption setelah gambar siap
            setTimeout(()=> {
              const cap = document.querySelector('#polaroid .polaroid-caption');
              if(cap) cap.classList.add('show');
            }, 300);
          });
        } else {
          // jika sudah ada polaroid (mis. kembali ke halaman terakhir), pastikan caption terlihat
          const cap = document.querySelector('#polaroid .polaroid-caption');
          if(cap) cap.classList.add('show');
        }
      } else {
        if(existing) existing.remove();
      }
    }

    prevBtn.addEventListener('click', ()=> { if(idx>0){ idx--; render(); } });
    nextBtn.addEventListener('click', ()=> { if(idx < pages.length-1){ idx++; render(); } });
    window.addEventListener('keydown', (e)=>{ if(e.key === 'ArrowRight') nextBtn.click(); if(e.key === 'ArrowLeft') prevBtn.click(); });

    function updateDots(){
      dotsEl.innerHTML = '';
      for(let i=0;i<pages.length;i++){
        const d = document.createElement('div');
        d.className = 'dot' + (i===idx ? ' active' : '');
        d.title = 'Halaman ' + (i+1);
        d.style.cursor = 'pointer';
        d.addEventListener('click', ()=> { idx = i; render(); });
        dotsEl.appendChild(d);
      }
    }

    // decorative elements
    (function addDecor(){
      if(!document.querySelector('.wax-seal')){
        const seal = document.createElement('div'); seal.className='wax-seal'; seal.setAttribute('aria-hidden','true'); seal.textContent='E'; paper.appendChild(seal);
        const paw1 = document.createElement('div'); paw1.className='paw'; paw1.textContent='🐾'; paper.appendChild(paw1);
        const paw2 = document.createElement('div'); paw2.className='paw p2'; paw2.textContent='🐾'; paper.appendChild(paw2);
        const paw3 = document.createElement('div'); paw3.className='paw p3'; paw3.textContent='🐾'; paper.appendChild(paw3);
      }
    })();

    // emoji cloud: positions chosen to stay near edges and not cover text
    (function addEmojiCloud(){
      const cloud = document.getElementById('emojiCloud');
      if(!cloud) return;

      // emoji pool (more of them)
      const pool = ['🤍','🐕','🐶','🤍','🐶','🐕','🤍','🐶','🤍','🐕','🐶','🤍'];

      // safe positions (percentages) around edges and corners
      const positions = [
        {left:'4%', top:'6%', cls:'small'},
        {left:'16%', top:'8%', cls:'mid'},
        {left:'28%', top:'12%', cls:'small'},
        {left:'6%', top:'72%', cls:'mid'},
        {left:'12%', top:'56%', cls:'small'},
        {left:'74%', top:'10%', cls:'mid'},
        {left:'86%', top:'18%', cls:'small'},
        {left:'68%', top:'66%', cls:'large'},
        {left:'46%', top:'4%', cls:'small'},
        {left:'88%', top:'56%', cls:'small'},
        {left:'36%', top:'78%', cls:'mid'},
        {left:'54%', top:'82%', cls:'small'}
      ];

      const count = Math.min(pool.length, positions.length);
      for(let i=0;i<count;i++){
        const span = document.createElement('div');
        span.className = 'e ' + positions[i].cls;
        span.style.left = positions[i].left;
        span.style.top = positions[i].top;
        span.style.zIndex = 4;
        span.textContent = pool[i];
        span.style.animationDelay = (Math.random()*1.6) + 's';
        // slightly reduce opacity for those near content center
        if(parseInt(positions[i].left) > 30 && parseInt(positions[i].left) < 70 && parseInt(positions[i].top) > 20 && parseInt(positions[i].top) < 70){
          span.style.opacity = 0.45;
        }
        cloud.appendChild(span);
      }
    })();

    document.querySelectorAll('.dog').forEach((el, i)=>{ const delay = (i * 0.9) + Math.random()*1.2; el.style.animationDelay = delay + 's'; });

    render();

    // API kecil untuk ubah foto tanpa edit file: SuratEliora.setPhoto(url)
    window.SuratEliora = {
      setPages(newPages){ if(Array.isArray(newPages) && newPages.length){ pages.length=0; newPages.forEach(p=>pages.push(p)); idx=0; render(); } },
      goTo(n){ if(n>=0 && n<pages.length){ idx=n; render(); } },
      setPhoto(url){ if(url){ const pol = document.getElementById('polaroid'); if(pol){ const img = pol.querySelector('img'); if(img){ img.src = url; img.style.display='block'; pol.style.backgroundImage=''; const cap = pol.querySelector('.polaroid-caption'); if(cap) cap.classList.add('show'); } else { pol.style.backgroundImage = `url('${url}')`; const cap = pol.querySelector('.polaroid-caption'); if(cap) cap.classList.add('show'); } } else { /* jika belum ada polaroid, reload agar PHOTO_URL dipakai */ window.location.reload(); } } }
    };
  </script>
</body>
</html>
